name: Author lock

# pull_request_target runs this file and the checker from main, so a pull
# request cannot weaken the check. The pull request's files are only read,
# never executed.
on:
  pull_request_target:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  author-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted checker and lock list from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Check out the files to verify
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - run: python3 trusted/check_author.py --root candidate --lock trusted/AUTHOR_LOCK.txt
